name: Validate VaultX

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'onboard/**'
      - '.github/workflows/validate-onboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
      - name: Test
        run: npm test
