name: Deploy Onboard

on:
  push:
    branches: [main]
    paths:
      - "onboard/**"
      - ".github/workflows/deploy-onboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: onboard-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: onboard/package-lock.json

      - name: Install Onboard dependencies
        run: npm ci
        working-directory: onboard

      - name: Test Onboard
        run: npm test
        working-directory: onboard

      - name: Build Onboard
        run: npm run build
        working-directory: onboard
        env:
          ONBOARD_BASE_PATH: /VaultX/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Onboard site
        uses: actions/upload-pages-artifact@v3
        with:
          path: onboard/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Onboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
