<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Onboard video sources</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <span class="brand">ONBOARD</span>
        <h1>Video sources</h1>
      </header>
      <button id="scan" class="scan-button" type="button">Scan this page</button>
      <div class="permissions">
        <button id="enable-direct" class="permission-button" type="button">Enable direct MP4 imports</button>
        <button id="enable-x" class="permission-button" type="button">Enable X imports</button>
        <button id="enable-redgifs" class="permission-button" type="button">Enable Redgifs imports</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">Scanning active page…</p>
      <ol id="candidates" class="candidate-list" aria-label="Detected MP4 sources"></ol>
      <footer>Enable a site to import its public post URLs in Onboard. Page scanning finds direct MP4s only.</footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
